name: ARISE backend verification
on:
  push:
    branches: [feature/robotics-platform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: pip install -r requirements.lock
      - name: Run regression suite without external AI billing
        run: pytest -q tests
        env:
          ARISE_VISUAL_DEV: '1'
          LAB_ENV: test
